name: Platform validation and evidence gate
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps .
      - run: aicg policy validate
      - run: aicg gate run
      - run: python examples/scenarios.py
      - run: python -m pip_audit -r requirements.lock --strict
      - run: aicg gate final
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: platform-evidence
          path: |
            .ai/evidence/
            .ai/runs/
          include-hidden-files: true
